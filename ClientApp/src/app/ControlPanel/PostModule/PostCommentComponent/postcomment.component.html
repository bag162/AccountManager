<div class="container" id="addCommentsFormGroup">
    <div class="row">
        <div class="col-3">
            <div class="form-group">
                <label>Select comment Group</label>
                <select class="form-control" id="commentSelect">
                    <option *ngFor="let Group of groupNames">{{Group}}</option>
                </select>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <div class="form-group">
                    <label>Add new Comments</label>
                    <textarea class="form-control" [(ngModel)]="newCommentsData"></textarea>
                </div>
            </div>
        </div>
        <div class="row mb-3">
            <div class="col-3">
                <button type="submit" class="btn btn-primary btn-lg" (click)="AddComments()">Add</button>
            </div>
        </div>
    </div>
</div>
<div id="successNot" class="alert alert-success" role="alert">Success</div>
<div id="errorNot" class="alert alert-danger" role="alert">Error</div>
<!-- Gen table -->
<table datatable [dtOptions]="dtOptions" class="row-border hover" id="accountTable"></table>
