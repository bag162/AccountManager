<div class="container">
    <div class="row mb-3">
        <div class="col">
            <label>Account Group</label>
            <select-account-group></select-account-group>
        </div>
        <div class="col">
            <label>Proxy Group</label>
            <select-proxy-group></select-proxy-group>
        </div>
    </div>
    <div class="row mb-3">
        <div class="col">
            <label>Count likes per 1 account</label>
            <input type="number" class="form-control" [(ngModel)]="likesPerAccount">
        </div>
        <div class="col">
            <label>Advert post group</label>
            <select id="selectAdvertPostGroup" class="form-control">
                <option *ngFor="let group of advertPostGroupNames">{{group}}</option>
            </select>
        </div>
    </div>
    <div class="row mb-3">
        <div class="col">
            <label>Task name</label>
            <input type="text" class="form-control" [(ngModel)]="taskName">
        </div>
    </div>
    <div class="row mb-3">
        <div class="col">
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="flexSwitchCheckChecked"
                    [(ngModel)]="likeIfPostCommentedPreviously">
                <label>Like if the post was previously commented on</label>
            </div>
        </div>
    </div>
    <button type="submit" class="btn btn-primary mb-3" (click)="AddTask()">Submit</button>
    <div id="successNot" class="alert alert-success" role="alert">Success</div>
    <div id="errorNot" class="alert alert-danger" role="alert">Error</div>
</div>
