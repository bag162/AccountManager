<div class="container">
    <div class="row mb-3">
        <div class="col">
            <label>Task name</label>
            <input type="text" class="form-control" [(ngModel)]="taskName">
        </div>
        <div class="col">
            <label>Advert account group for cloning</label>
            <select class="form-control" id="selectAdvertAccountGroup">
                <option *ngFor="let item of advertAccountGroupsForCloning">{{item}}</option>
            </select>
        </div>
    </div>
    <div class="row mb-3">
        <div class="col">
            <label>Proxy group</label>
            <select-proxy-group></select-proxy-group>
        </div>
        <div class="col">
            <label>Group of accounts that will collect data</label>
            <select-account-group></select-account-group>
        </div>
    </div>
    <div class="row mb-3">
        <div class="col">
            <label>How many posts to collect</label>
            <input class="form-control" type="number" [(ngModel)]="countPostToCollect">
        </div>
        <div class="col">
            <label>How many comments to collect</label>
            <input class="form-control" type="number" [(ngModel)]="countCommentToCollect">
        </div>
    </div>
    <div class="row mb-3">
        <div class="col">
            <label>Clon group for save</label>
            <select class="form-control" id="selectCloneGroup">
                <option *ngFor="let item of cloneGroupForSave">{{item}}</option>
            </select>
        </div>
    </div>
    <button type="submit" class="btn btn-primary mb-3" (click)="AddTask()">Submit</button>
    <div id="successNot" class="alert alert-success" role="alert">Success</div>
    <div id="errorNot" class="alert alert-danger" role="alert">Error</div>
</div>
